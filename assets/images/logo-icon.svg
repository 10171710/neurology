<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ncPulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="ncGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ncGrad)" />
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Background Subtle Brain Lobe Arcs -->
  <path d="M14 17C14 13.5 17 11 20.5 11C23 11 24 12.5 24 14C24 12.5 25 11 27.5 11C31 11 34 13.5 34 17C34 20.5 31.5 22.5 29 23.5C27 24.3 26 26 26 28H22C22 26 21 24.3 19 23.5C16.5 22.5 14 20.5 14 17Z" 
        stroke="white" stroke-opacity="0.25" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Synapse Node Points -->
  <circle cx="20.5" cy="11" r="1.75" fill="#a5f3fc" />
  <circle cx="27.5" cy="11" r="1.75" fill="#a5f3fc" />
  <circle cx="14" cy="17" r="1.75" fill="#a5f3fc" />
  <circle cx="34" cy="17" r="1.75" fill="#a5f3fc" />

  <!-- Central Clinical Cross / Shield Motif -->
  <path d="M21.5 18H26.5V21.5H30V26.5H26.5V30H21.5V26.5H18V21.5H21.5V18Z" 
        fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Dynamic Neural EKG / Pulse Line Overlaid -->
  <path d="M8 24H16L19 19L22 29L26 15L29 27L32 24H40" 
        stroke="url(#ncPulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ncGlow)" />

  <!-- Spark Pulse Dot -->
  <circle cx="26" cy="15" r="2" fill="#ffffff" />
</svg>
