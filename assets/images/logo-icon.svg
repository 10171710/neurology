<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ncBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ncPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="ncGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="ncPulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Bevel Border -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#ncBgGrad)" />
  <rect x="2" y="2" width="44" height="44" rx="13" stroke="url(#ncGlowGrad)" stroke-width="1.5" />

  <!-- Dual Hemisphere Brain Architecture (Harmonious, Refined Curves) -->
  <!-- Left Lobe -->
  <path d="M22 13.5C19.5 13.5 17.5 14.8 16.5 16.8C14.5 17.2 13 19 13 21.2C13 22.8 13.8 24.2 15 25C14.5 26.2 14.5 27.8 15.5 29C16.8 30.5 19 31.5 22 31.8" 
        stroke="white" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Right Lobe -->
  <path d="M26 13.5C28.5 13.5 30.5 14.8 31.5 16.8C33.5 17.2 35 19 35 21.2C35 22.8 34.2 24.2 33 25C33.5 26.2 33.5 27.8 32.5 29C31.2 30.5 29 31.5 26 31.8" 
        stroke="white" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Central Clinical Cross Core -->
  <path d="M22 17.5H26V21.5H30V25.5H26V29.5H22V25.5H18V21.5H22V17.5Z" 
        fill="white" fill-opacity="0.18" stroke="white" stroke-opacity="0.4" stroke-width="1" stroke-linejoin="round" />

  <!-- Refined Precision Neural Heartbeat / EEG Pulse -->
  <path d="M7 23.5H15L17.5 19L21 28L24 14L27 30L30.5 20.5L33 23.5H41" 
        stroke="url(#ncPulseGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#ncPulseGlow)" />

  <!-- Luminous Synapse Nodes -->
  <circle cx="24" cy="14" r="1.8" fill="#ffffff" />
  <circle cx="17.5" cy="19" r="1.3" fill="#a5f3fc" />
  <circle cx="30.5" cy="20.5" r="1.3" fill="#a5f3fc" />
  <circle cx="21" cy="28" r="1.3" fill="#a5f3fc" />
  <circle cx="27" cy="30" r="1.3" fill="#a5f3fc" />
</svg>
