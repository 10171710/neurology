<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>New Patient Registration | NeuroCare Clinic</title>
  <meta name="description" content="Register as a new patient at NeuroCare to initiate your chronic migraine diagnostic evaluation and digital headache diary account.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            },
            neuro: {
              blue: '#0284c7',
              cyan: '#06b6d4',
              dark: '#0f172a',
              card: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden transition-colors duration-300">

  <!-- Unique Clinical Neurology Nurse Care Intake Background Image with High-Clarity Dual-Theme Overlays -->
  <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
    <img src="assets/images/services/service-nurse-care.jpg" alt="Clinical Neurology Nurse Care and Patient Intake" class="w-full h-full object-cover object-center filter brightness-95 contrast-105 opacity-80 dark:opacity-65 transition-all duration-700">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-50/80 via-slate-50/55 to-slate-50/85 dark:from-[#070d14]/85 dark:via-[#070d14]/65 dark:to-[#070d14]/95 transition-colors duration-300"></div>
  </div>

  <!-- Minimal Top Header: Theme + RTL (NO NAVBAR, NO BACK LINK) -->
  <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-end relative z-10">
    <div class="flex items-center gap-2">
      <!-- RTL / LTR Toggle Button -->
      <button type="button" onclick="toggleRTL()" title="Switch Text Direction" class="px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-center shadow-sm">
        <span class="rtl-indicator">LTR</span>
      </button>

      <!-- Theme Toggle -->
      <button type="button" onclick="toggleTheme()" title="Toggle Dark/Light Mode" class="p-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition shadow-sm">
        <i data-lucide="moon" class="w-4 h-4 theme-icon-moon"></i>
        <i data-lucide="sun" class="w-4 h-4 theme-icon-sun hidden text-amber-400"></i>
      </button>
    </div>
  </header>

  <!-- Registration Card Section -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 py-8 relative z-10">
    <div class="max-w-xl w-full bg-white dark:bg-[#0c131a] rounded-3xl p-6 sm:p-10 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-6 backdrop-blur-xl">
      
      <!-- Centered Brand Logo & Header matching navbar and reference -->
      <div class="text-center mb-6">
        <a href="index.html" class="inline-flex items-center justify-center gap-3 mb-3 group" title="Return to Home">
          <img src="assets/images/logo-icon.svg" alt="NeuroCare Logo" class="w-11 h-11 flex-shrink-0 drop-shadow-sm group-hover:scale-105 transition-transform">
          <div class="flex flex-col text-left leading-tight">
            <span class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">
              Neuro<span class="text-teal-600 dark:text-teal-400">Care</span>
            </span>
            <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Neurology &amp; Headache Clinic</span>
          </div>
        </a>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#0f172a] dark:text-white tracking-tight">New Patient Registration</h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Create your secure clinical profile for headache tracking &amp; appointments.</p>
      </div>

      <div id="reg-card-body">
        <!-- Error Alert -->
        <div id="reg-error-msg" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs font-semibold" role="alert"></div>

        <form id="patientRegistrationForm" class="space-y-4" novalidate>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="reg-first" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">First Name</label>
              <input type="text" id="reg-first" placeholder="Sarah" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
            </div>
            <div>
              <label for="reg-last" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Last Name</label>
              <input type="text" id="reg-last" placeholder="Jenkins" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="reg-dob" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Date of Birth</label>
              <input type="date" id="reg-dob" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
            </div>
            <div>
              <label for="reg-phone" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
              <input type="tel" id="reg-phone" placeholder="(555) 000-0000" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
            </div>
          </div>

          <div>
            <label for="reg-email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
            <input type="email" id="reg-email" placeholder="sarah@example.com" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
          </div>

          <div>
            <label for="reg-reason" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Primary Reason for Visit</label>
            <select id="reg-reason" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
              <option value="">Select your condition / symptoms</option>
              <option>Refractory Chronic Migraine (CGRP Infusion Interest)</option>
              <option>Cluster Headache / Trigeminal Pain</option>
              <option>Post-Concussion Syndrome &amp; Brain Fog</option>
              <option>Diagnostic EEG / Seizure Differentiation</option>
              <option>Botox for Chronic Migraine Evaluation</option>
              <option>Second Opinion on Brain MRI Scans</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="reg-pass" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Create Password</label>
              <input type="password" id="reg-pass" placeholder="••••••••" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
            </div>
            <div>
              <label for="reg-pass-confirm" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
              <input type="password" id="reg-pass-confirm" placeholder="••••••••" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-900 dark:text-white">
            </div>
          </div>

          <div class="pt-2">
            <label class="flex items-start gap-2.5 text-xs text-slate-600 dark:text-slate-400 cursor-pointer">
              <input type="checkbox" id="reg-consent" required checked class="w-4 h-4 text-teal-600 rounded focus:ring-teal-500 mt-0.5">
              <span>I agree to HIPAA electronic health record privacy guidelines and consent to tele-neurology clinical communications.</span>
            </label>
          </div>

          <button type="submit" class="w-full py-3.5 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-extrabold text-sm shadow-lg shadow-teal-600/30 transition-all flex items-center justify-center gap-2">
            <span>Complete Patient Registration</span>
            <i data-lucide="check-circle" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
          <span>Already have an account?</span>
          <a href="login.html" class="font-bold text-teal-600 dark:text-teal-400 hover:underline ml-1">Sign In Here</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-500 dark:text-slate-400 relative z-10">
    <p>&copy; 2026 NeuroCare Neurology &amp; Headache Clinic. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    lucide.createIcons();

    const USERS_STORAGE_KEY = 'neuro_auth_users';

    function getRegisteredUsers() {
      try {
        const raw = localStorage.getItem(USERS_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveUser(user) {
      try {
        let users = getRegisteredUsers();
        users = users.filter(u => u.email.toLowerCase() !== user.email.toLowerCase());
        users.push(user);
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
        return true;
      } catch (e) {
        return false;
      }
    }

    const regForm = document.getElementById('patientRegistrationForm');
    if (regForm) {
      regForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const firstName = document.getElementById('reg-first').value.trim();
        const lastName = document.getElementById('reg-last').value.trim();
        const dob = document.getElementById('reg-dob').value;
        const phone = document.getElementById('reg-phone').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const reason = document.getElementById('reg-reason').value;
        const pass = document.getElementById('reg-pass').value;
        const confirmPass = document.getElementById('reg-pass-confirm').value;
        const consent = document.getElementById('reg-consent').checked;
        const errBox = document.getElementById('reg-error-msg');

        if (errBox) errBox.classList.add('hidden');

        if (!firstName || !lastName || !email || !pass) {
          if (errBox) {
            errBox.textContent = 'Please fill in all required fields.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        if (pass.length < 6) {
          if (errBox) {
            errBox.textContent = 'Password must be at least 6 characters long.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        if (pass !== confirmPass) {
          if (errBox) {
            errBox.textContent = 'Passwords do not match. Please re-enter.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        if (!consent) {
          if (errBox) {
            errBox.textContent = 'Please accept the HIPAA privacy guidelines.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        // Check if email already registered
        const users = getRegisteredUsers();
        const exists = users.find(u => u.email.toLowerCase() === email);
        if (exists) {
          if (errBox) {
            errBox.innerHTML = 'An account with this email already exists. Please <a href="login.html" class="underline font-bold text-teal-600 dark:text-teal-400">Sign in instead</a>.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        // Create and save new real account
        const patientId = '#NC-' + Math.floor(1000 + Math.random() * 9000);
        const newUser = {
          name: firstName + ' ' + lastName,
          email: email,
          password: pass,
          phone: phone,
          dob: dob,
          reason: reason,
          role: 'customer',
          id: patientId
        };

        saveUser(newUser);

        // Display in-place success on the same page
        const cardBody = document.getElementById('reg-card-body');
        if (cardBody) {
          cardBody.innerHTML = `
            <div class="py-4 text-center animate-fade-in">
              <div class="w-16 h-16 mx-auto rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-500 dark:text-emerald-400 text-3xl mb-4 shadow-lg shadow-emerald-500/20">
                <i data-lucide="check-circle-2" class="w-9 h-9"></i>
              </div>

              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 dark:bg-emerald-500/20 border border-emerald-500/30 text-emerald-700 dark:text-emerald-300 text-xs font-bold uppercase tracking-wider mb-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Profile Created
              </div>

              <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">Registration Successful!</h2>
              <p class="text-sm text-slate-600 dark:text-slate-300 mt-2 max-w-sm mx-auto">
                Welcome to NeuroCare, <strong class="text-slate-900 dark:text-white">${firstName} ${lastName}</strong>. Your clinical patient record has been registered.
              </p>

              <div class="mt-5 p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left text-xs space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-slate-500 dark:text-slate-400 font-semibold">Registered Email:</span>
                  <span class="text-slate-900 dark:text-white font-mono font-medium">${email}</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-slate-500 dark:text-slate-400 font-semibold">Assigned Patient ID:</span>
                  <span class="text-teal-600 dark:text-teal-400 font-bold font-mono">${patientId}</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-slate-500 dark:text-slate-400 font-semibold">Account Status:</span>
                  <span class="text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active &amp; Ready for Sign In
                  </span>
                </div>
              </div>

              <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-800 flex flex-col gap-2.5">
                <a href="login.html" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-extrabold text-sm shadow-lg shadow-teal-600/30 transition">
                  <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Patient Portal
                </a>
              </div>
            </div>
          `;
          lucide.createIcons();
        }

        showToast('Registration successful! You can now log in.', 'success');
      });
    }
  </script>
</body>
</html>
